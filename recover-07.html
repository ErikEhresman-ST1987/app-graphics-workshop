<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprite Factory Cache Recovery</title><style>body{font:17px system-ui,sans-serif;background:#17202b;color:#fff;padding:2rem;line-height:1.5}button{padding:1rem;font-size:1rem}a{color:#9cdaff}</style></head><body><h1>Sprite Factory — Cache Recovery</h1><p id="status">Preparing to remove the old offline experiment…</p><button id="retry" hidden>Retry cleanup</button><p><a href="./index.html?recovered=07">Open Sprite Factory</a></p><script>async function cleanup(){const status=document.getElementById('status');status.textContent='Removing the old service worker and Sprite Factory caches…';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const reg of regs){if(reg.scope.startsWith(location.origin+location.pathname.replace(/[^/]*$/,'')))await reg.unregister()}}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(key=>key.startsWith('sprite-')).map(key=>caches.delete(key)))}status.textContent='Cleanup complete. Opening Sprite Factory…';location.replace('./index.html?recovered=07&v=20261010g')}catch(err){status.textContent='Cleanup could not finish: '+err.message;document.getElementById('retry').hidden=false}}document.getElementById('retry').addEventListener('click',cleanup);cleanup();</script></body></html>
